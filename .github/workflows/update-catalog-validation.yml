name: Update catalog validation

on:
  pull_request:
    paths:
      - "updates/v1/**"
      - ".github/workflows/update-catalog-validation.yml"
  push:
    branches: [main]
    paths:
      - "updates/v1/**"
      - ".github/workflows/update-catalog-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install JSON Schema validator and standard format checks
        run: npm install --no-save ajv@8 ajv-formats@3
      - name: Validate catalog against JSON Schema
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const Ajv = require('ajv/dist/2020').default;
          const addFormats = require('ajv-formats');
          const ajv = new Ajv({ allErrors: true, strict: true, allowUnionTypes: true });
          addFormats(ajv);
          const schema = JSON.parse(fs.readFileSync('updates/v1/catalog.schema.json', 'utf8'));
          const catalog = JSON.parse(fs.readFileSync('updates/v1/catalog.json', 'utf8'));
          if (!ajv.validate(schema, catalog)) {
            console.error(ajv.errors);
            process.exit(1);
          }
          console.log('Update catalog schema and formats valid');
          NODE
      - name: Check web updater JavaScript syntax
        run: node --check updates/v1/web-update-client.js
